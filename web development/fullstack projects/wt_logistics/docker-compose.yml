services:
  backend:
    build: ./api
    container_name: flask-backend
    ports:
      - "5002:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    volumes:
      - ./api:/app

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:5000
        IS_DOCKER: true
    container_name: next-frontend
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
      - IS_DOCKER=true
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - backend
